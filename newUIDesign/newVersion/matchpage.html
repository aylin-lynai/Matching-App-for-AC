<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching App</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="header">
        <header>
            <nav>
                <div class="logo">Matching App</div>
                <div>
                    <a href="startPage.html">Home</a>
                    <a href="aboutus.html">About us</a>
                    <a href="literature.html">Literatures</a>
                    <a href="contact.html">Contact</a>
                    <a href="privacy.html">Privacy</a>
                
                    
                </div>
            </nav>
        </header>
    </div>

    <div class="container">
        <div class="left-side">
            <h1>Your matches from best to worst are:</h1>
            <div id="matches">
                <!-- This is where the matches will be displayed -->
            </div>
        </div>
        <div class="right-side">
            <img src="{{ url_for('static', filename='images/one.jpg') }}" alt="one">
        </div>
    </div>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/ranked_users')
            .then(response => response.json())
            .then(data => {
                const matchesContainer = document.getElementById('matches');
                data.forEach(user => {
                    const userElement = document.createElement('div');
                    userElement.innerHTML = `<strong>Name:</strong> ${user.username}<br>
                                             <strong>Email:</strong> ${user.email}<br>
                                             <strong>Similarity:</strong> ${(user.similarity * 100).toFixed(2)}%<br><br>`;
                    matchesContainer.appendChild(userElement);
                });
            })
            .catch(error => {
                console.error('Error fetching ranked users:', error);
            });
    });
    </script>
    </body>
    </html>
